upstream superstory_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream superstory_llm_tasks {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    server_name www.superstory.xyz superstory.xyz;

    client_max_body_size 10m;
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /static/ {
        root /var/www/superstory;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location = /vendor/supabase.js {
        alias /var/www/superstory/static/js/vendor/supabase.js;
        expires 7d;
        access_log off;
    }

    location = / {
        root /var/www/superstory/static/html;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /auth {
        root /var/www/superstory/static/html;
        try_files /auth.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /create {
        root /var/www/superstory/static/html;
        try_files /create.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /works {
        root /var/www/superstory/static/html;
        try_files /works.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /mynote {
        root /var/www/superstory/static/html;
        try_files /mynote.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /notes {
        root /var/www/superstory/static/html;
        try_files /mynote.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /usercenter {
        root /var/www/superstory/static/html;
        try_files /usercenter.html =404;
        add_header Cache-Control "no-cache";
    }

    # Keep the process-local task manager on a dedicated single-worker service.
    location ^~ /api/llm-tasks/ {
        proxy_pass http://superstory_llm_tasks;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    location ^~ /api/ {
        proxy_pass http://superstory_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    location / {
        proxy_pass http://superstory_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
