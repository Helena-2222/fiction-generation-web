services:
  api:
    build:
      context: .
    env_file:
      - .env
    command:
      - gunicorn
      - app.main:app
      - --workers
      - "${API_WORKERS:-4}"
      - --worker-class
      - uvicorn_worker.UvicornWorker
      - --bind
      - 0.0.0.0:8000
      - --timeout
      - "240"
      - --graceful-timeout
      - "30"
      - --keep-alive
      - "5"
      - --worker-tmp-dir
      - /dev/shm
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  llm-tasks:
    build:
      context: .
    env_file:
      - .env
    command:
      - gunicorn
      - app.main:app
      - --workers
      - "1"
      - --worker-class
      - uvicorn_worker.UvicornWorker
      - --bind
      - 0.0.0.0:8000
      - --timeout
      - "240"
      - --graceful-timeout
      - "30"
      - --keep-alive
      - "5"
      - --worker-tmp-dir
      - /dev/shm
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:stable-alpine
    depends_on:
      api:
        condition: service_healthy
      llm-tasks:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/var/www/superstory/static:ro
    restart: unless-stopped

